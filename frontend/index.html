<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Palette: Stealth &amp; Siege</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <!-- ─── Floating Top Game Header HUD ─── -->
    <header class="app-header">
      <div class="logo-container">
        <span class="logo-icon">🛡️</span>
        <div>
          <h1>SHADOW PALETTE</h1>
          <p class="subtitle">Stealth &amp; Siege</p>
        </div>
      </div>

      <nav class="nav-tabs">
        <button id="tab-map" class="nav-tab active">🗺️ World Map</button>
        <button id="tab-builder" class="nav-tab">🏗️ Base Builder</button>
        <button id="tab-raid" class="nav-tab">⚔️ Stealth Raid</button>
      </nav>

      <div class="hud-bar">
        <div class="hud-pill">
          <span>User</span> <strong id="hud-user-id">#12</strong>
        </div>
        <div class="hud-pill">
          <span>Coins</span> <strong id="hud-coins">500</strong> 🪙
        </div>
        <div class="hud-pill">
          <span>Ink</span> <strong id="hud-ink">100</strong> ✒️
        </div>
        <div class="hud-pill">
          <span>Chips</span> <strong id="hud-chips">200</strong> 💎
        </div>
        <div class="hud-pill">
          <span>Base</span> <strong id="hud-plot">#1</strong>
        </div>
      </div>
    </header>

    <!-- ─── Main Fullscreen Game Viewport ─── -->
    <main class="game-viewport">
      <div class="view-badge-container">
        <span id="view-badge" class="view-badge">Click Unclaimed Plot to Claim</span>
      </div>

      <canvas id="gameCanvas" width="800" height="600"></canvas>

      <!-- ─── Floating CoC-Style Bottom Action Dock ─── -->
      <div class="game-bottom-dock">
        <!-- Palette Color Swatches -->
        <div class="dock-card" id="card-palette">
          <span class="dock-title">Camo Surface Palette</span>
          <div class="color-swatches">
            <button class="color-swatch active" data-color="#F1FAEE" style="background-color: #F1FAEE;" title="White (35% Max Quota)"></button>
            <button class="color-swatch" data-color="#F4C245" style="background-color: #F4C245;" title="Yellow (35% Max Quota)"></button>
            <button class="color-swatch" data-color="#2A9D8F" style="background-color: #2A9D8F;" title="Green (35% Max Quota)"></button>
            <button class="color-swatch" data-color="#E63946" style="background-color: #E63946;" title="Red (35% Max Quota)"></button>
            <button class="color-swatch" data-color="#264653" style="background-color: #264653;" title="Blue (35% Max Quota)"></button>
          </div>
        </div>

        <!-- Structure Placement Toolbar -->
        <div class="dock-card" id="card-placement">
          <span class="dock-title">Build &amp; Defense Dock</span>
          <div class="tool-grid">
            <button class="tool-btn active" data-tool="CRAFT_HOUSE">
              <span>🏠 Craft House</span>
              <small>4×4 (16 Tiles)</small>
            </button>
            <button class="tool-btn" data-tool="INK_HOUSE">
              <span>✒️ Ink House</span>
              <small>3×3 (9 Tiles)</small>
            </button>
            <button class="tool-btn" data-tool="SLEEP_HOUSE">
              <span>🛏️ Sleep House</span>
              <small>3×3 (9 Tiles)</small>
            </button>
            <button class="tool-btn" data-tool="COIN_GENERATOR">
              <span>💰 Mint Generator</span>
              <small>4×3 (12 Tiles)</small>
            </button>
            <button class="tool-btn" data-tool="LIGHTHOUSE">
              <span>💡 Lighthouse</span>
              <small>Spotlight Defense</small>
            </button>
            <button class="tool-btn" data-tool="PATROL_ROBOT">
              <span>🤖 PatrolRobot</span>
              <small>Guard Robot</small>
            </button>
          </div>
        </div>
      </div>

      <!-- ─── Floating Collapsible Side Widgets ─── -->
      <aside class="floating-widget">
        <!-- Stealth Raid Card -->
        <div class="widget-card" id="card-raid">
          <h3>⚔️ Stealth Raid Launcher</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <label style="font-size: 0.75rem; color: var(--text-muted);">Target User ID:</label>
              <input type="number" id="input-defender-id" value="34" min="1" style="width: 70px; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: #fff; text-align: center; font-weight: bold;" />
            </div>
            <button id="btn-start-raid" class="btn-game" style="background: linear-gradient(135deg, #f43f5e 0%, #be123c 100%); color: #fff; box-shadow: 0 4px 12px rgba(244, 63, 94, 0.4);">⚔️ Launch Stealth Raid</button>
            <button id="btn-hit-wall" class="btn-game" style="background: rgba(251, 191, 36, 0.2); color: var(--accent-gold); border: 1px solid var(--accent-gold); display: none;">🔨 Hit Gate Wall (Spacebar)</button>
            <button id="btn-submit-raid" class="btn-game" style="background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; display: none;">✅ Extract &amp; Complete Raid</button>
          </div>
        </div>

        <!-- Player Config Card -->
        <div class="widget-card">
          <h3>👤 Operative Profile</h3>
          <div style="display: flex; gap: 8px; align-items: center;">
            <input type="number" id="input-user-id" value="12" min="1" style="width: 70px; padding: 4px 8px; border-radius: 8px; background: rgba(0,0,0,0.5); border: 1px solid var(--border-color); color: #fff; text-align: center; font-weight: bold;" />
            <button id="btn-set-user" class="btn-game" style="flex: 1; background: rgba(255, 255, 255, 0.08); color: var(--text-primary); border: 1px solid var(--border-color);">Switch ID</button>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
