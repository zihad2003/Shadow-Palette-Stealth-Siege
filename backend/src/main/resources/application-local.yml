# Local / Embedded profile — file-backed H2 with MySQL compatibility mode so it runs anywhere without external DB.
spring:
  datasource:
    url: ${SPRING_LOCAL_DATASOURCE_URL:jdbc:h2:file:./data/shadow_palette;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE}
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

server:
  port: ${PORT:8080}
