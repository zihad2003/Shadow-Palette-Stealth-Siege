# Local smoke profile — in-memory H2 so WebSocket / live-raid can run without MySQL.
spring:
  datasource:
    url: jdbc:h2:mem:shadow_palette;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true

server:
  port: 8080
